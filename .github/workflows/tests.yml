name: FishingFleet tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install SQLite3
      run: sudo apt-get install -y libsqlite3-dev

    - name: Install GoogleTest
      run: sudo apt-get install -y libgtest-dev libgmock-dev

    - name: Install coverage tools
      run: sudo apt-get install -y lcov

    - name: Compile tests
      run: |
        g++ -std=c++17 --coverage -fprofile-arcs -ftest-coverage \
          -I./includes \
          tests/tests.cpp \
          src/auth.cpp \
          src/database.cpp \
          src/bonus.cpp \
          src/statistics.cpp \
          src/trip.cpp \
          src/utils.cpp \
          -lsqlite3 -lgtest -lgtest_main -lpthread \
          -o fftest

    - name: Run tests
      run: ./fftest

    - name: Generate coverage report
      run: |
        lcov --capture --directory . --output-file coverage.info --no-external
        lcov --remove coverage.info 'tests/*' --output-file coverage.info
        lcov --list coverage.info

    - name: Generate HTML report
      run: genhtml coverage.info --output-directory coverage_report

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage_report/