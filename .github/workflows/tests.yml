name: FishingFleet tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install SQLite3
      run: sudo apt-get install -y libsqlite3-dev

    - name: Install GoogleTest
      run: sudo apt-get install -y libgtest-dev libgmock-dev

    - name: Install gcovr
      run: sudo apt-get install -y gcovr

    - name: Compile tests
      run: |
        g++ -std=c++17 --coverage -fprofile-arcs -ftest-coverage \
          -I./includes \
          tests/tests.cpp \
          src/auth.cpp \
          src/database.cpp \
          src/bonus.cpp \
          src/statistics.cpp \
          src/trip.cpp \
          src/utils.cpp \
          -lsqlite3 -lgtest -lgtest_main -lpthread \
          -o fftest

    - name: Run tests
      run: ./fftest

    - name: Generate coverage report
      run: |
        gcovr --root . \
          --exclude 'tests/.*' \
          --exclude '/usr/.*' \
          --html --html-details -o coverage_report.html \
          --print-summary

    - name: Display coverage summary
      run: gcovr --root . --exclude 'tests/.*' --exclude '/usr/.*'

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage_report.html